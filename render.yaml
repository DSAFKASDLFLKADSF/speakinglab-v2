# Render Blueprint — AI Speaking Trainer Python API
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Push this repo to GitHub
#   2. Render Dashboard → New → Blueprint → connect repo
#   3. Set secret env vars (GLM_API_KEY, OPENAI_API_KEY, etc.) when prompted
#
# Or create a Web Service manually and copy build/start commands below.

services:
  - type: web
    name: ai-speaking-trainer-python
    runtime: python
    region: singapore
    plan: free
    rootDir: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # --- Required: Zhipu GLM scoring ---
      - key: GLM_API_KEY
        sync: false
      # Alias supported by main.py / glm_client.py (optional if GLM_API_KEY is set)
      - key: ZHIPU_API_KEY
        sync: false

      # --- AssemblyAI transcription (primary — used by Listen & Repeat + Interview) ---
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: ASSEMBLYAI_BASE_URL
        value: https://api.assemblyai.com
      - key: ASSEMBLYAI_SPEECH_MODELS
        value: universal-2

      # --- Whisper transcription (fallback — only if AssemblyAI not set) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: WHISPER_MODEL
        value: whisper-1

      # --- Zhipu GLM scoring only ---
      - key: GLM_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: MODEL_NAME
        value: glm-4.7-flashx

      # --- Service auth (Next.js → Python Bearer token) ---
      - key: PYTHON_SPEECH_API_KEY
        sync: false

      # --- CORS: set to your deployed Next.js origin ---
      - key: CORS_ORIGINS
        value: https://your-next-app.onrender.com

      # --- Runtime ---
      - key: LOG_LEVEL
        value: INFO
      - key: DEV_ECHO_REFERENCE
        value: "false"
